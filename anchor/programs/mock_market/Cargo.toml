[package]
name = "mock_market"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
index_math = { path = "../../crates/index_math" }

[dev-dependencies]
test_utils = { path = "../../crates/test_utils" }
index_math = { path = "../../crates/index_math" }
litesvm = "0.16.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
